- type: reagent
  id: Blood
  reactiveEffects:
    Extinguish:
      methods: [ Touch ]
      effects:
      - !type:Extinguish
        fireStacksAdjustment: -0.5 # blood can extinguish fires 1/3rd as good as water, maybe it makes sense
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Hunger
        factor: 1.0
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vampire ]
      - !type:EvenHealthChange
        damage:
          Airloss: -3
          Toxin: -1.25